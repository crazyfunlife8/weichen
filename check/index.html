const SYM = {

  const tips = [];
  if (A.filter !== 'w2') tips.push(`<div class="tip"><b>濾網</b>　能源署建議兩週洗一次。打開前面板，濾網往上推再往下拉就出來了，從背面用水沖，陰乾再裝回去。台電說濾網兩到三週洗一次，可以省約一成的冷氣用電<div class="src">出處：<a href="https://www.moeaea.gov.tw/ECW/populace/content/Content.aspx?menu_id=86" target="_blank" rel="noopener">經濟部能源署 省電36計</a></div></div>`);
  if (A.pro !== 'y1') tips.push(`<div class="tip"><b>拆洗</b>　濾網只是最外面那層，裡面的鰭片、風扇、接水盤要整台拆開才洗得到。${A.pro === 'never' ? '從來沒拆洗過的，建議排在最前面' : '一到兩年沒洗，差不多該約了'}</div>`);
  if (A.temp !== 't26') tips.push(`<div class="tip"><b>溫度</b>　能源署建議開 26 到 28 度，搭配電扇。台電說溫度每調高 1 度，大約省 6% 的冷氣用電</div>`);
  if (A.out !== 'open') tips.push(`<div class="tip"><b>室外機</b>　室外機是把家裡的熱吹出去的，被東西圍住熱風吹不走，冷氣就越吹越沒力。前面別堆東西，${A.out === 'unknown' ? '下次去看一眼' : '要搬位置先問師傅，搬室外機要先收冷媒'}</div>`);
  if (A.age === 'a10p') tips.push(`<div class="tip"><b>10 年以上</b>　舊機效率比較差，用的如果是 R22 冷媒，現在維修跟補冷媒都比較貴。想換新的話，能源署有汰舊換新補助，換一級能效的冷氣每台補助 3,000 元，發票要在 2026/12/31 前，經費用完會提早結束<div class="src">詳情看 <a href="https://save3000.moeaea.gov.tw/subsidy02/index/index.aspx" target="_blank" rel="noopener">能源署節能家電補助網站</a></div></div>`);
  if (tips.length) h += `<div class="sec"><h3>${lv === 1 ? '小地方顧好' : '小林的建議'}</h3><div class="card">${tips.join('')}</div></div>`;

  h += `<div class="sec"><h3>不要自己來的事</h3><div class="card"><div class="tip">拆機、補冷媒、動電路，交給有證照的冷氣師傅。ㄟ 真的，讓專業的來</div></div></div>`;

  h += `<div class="sec case"><h3>小林最近做的</h3><img src="img/case-1.jpg" alt="員林日照中心天花板嵌入式冷氣"><p>彰化員林日照中心，大教室裝天花板嵌入式，長輩運動時風不會直直對著人吹</p></div>`;

  const sheet = sheetText(lv);
  h += `<div class="cta"><h3>把結果傳給小林</h3><p>${CONFIG.LINE_OA ? '按下去會打開 LINE，整理單已經幫你填好，直接送出就好' : '先加小林 LINE，再把下面這份整理單貼過去，小林看了就知道你家狀況'}</p>
    ${CONFIG.LINE_OA ? '' : `<div class="sheet">${sheet}</div>`}
    <a class="btn" id="toLine" href="#">${CONFIG.LINE_OA ? '用 LINE 傳給小林' : '加小林 LINE'}</a>
    <div style="height:10px"></div><button class="btn ghost" id="copy">複製整理單</button>
    <p class="code">你的代碼：${CODE}</p></div>
    <p class="note" style="margin-top:14px">服務範圍：${CONFIG.AREA}　不比廠牌、不在這裡報價，你家狀況看過再說</p>`;

  $('#quiz').classList.add('hide');
  const r = $('#result'); r.innerHTML = h; r.classList.remove('hide'); window.scrollTo(0, 0);
  $('#redo').onclick = () => begin('check');
  $('#toLine').href = lineHref(sheet);
  $('#toLine').onclick = () => { if (!CONFIG.LINE_OA) copy(sheet, false); track('line', {level: lv}); };
  $('#copy').onclick = () => copy(sheet, true);
  track('result', {level: lv});
}

// ===== 看價格的結果 =====
const PRICE = {split:[3000,4000], window:[3000,4000], duct:[3000,5000]};
function priceRange() {
  const m = new Date().getMonth() + 1, off = m >= 10 || m <= 2;
  const t = A.type === 'unknown' ? 'split' : A.type;
  let r = (t === 'split' && off) ? [2500,3500] : PRICE[t];
  const n = A.n === '3' ? 3 : Number(A.n);
  const per = n >= 3 ? [r[0] - 300, r[1] - 300] : r;
  return {t, off: t === 'split' && off, per, n, total: [per[0] * n, per[1] * n]};
}
const fmt = x => x.toLocaleString('en-US');
function quoteResult() {
  const d = new Date();
  CODE = `XQ${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${Math.floor(100 + Math.random() * 900)}`;
  const inst = A.need === 'install', away = A.area === 'other', P = priceRange();
  let h = `<div class="top"><b>小林的參考價</b><button class="back" id="redo">重新選</button></div>`;
  if (inst) {
    h += `<div class="verdict"><span class="lv">裝冷氣</span><h2>標準安裝<br>4,500 起</h2><p>舊機免費幫你載走，實際看管線長度跟室外機放哪</p><img src="img/p6-扛室外機.png" alt=""></div>`;
  } else {
    const each = `${fmt(P.per[0])}–${fmt(P.per[1])}`;
    h += `<div class="verdict"><span class="lv">${label('type', A.type)}${A.type === 'unknown' ? '（先用分離式算）' : ''}</span>
      <h2>${P.n >= 3 ? '3 台起 每台<br>' : P.n === 2 ? '2 台大概<br>' : '1 台大概<br>'}${P.n === 2 ? `${fmt(P.total[0])}–${fmt(P.total[1])}` : each}</h2>
      <p>${P.off ? '10 月到 2 月淡季價　' : ''}不收訂金 洗完再付</p><img src="img/p3-比讚.png" alt=""></div>`;
  }
  h += `<div class="sec"><h3>這個價格</h3><div class="card">`;
  if (inst) {
    h += `<div class="tip"><b>包含</b>　標準安裝，舊機免費載走</div><div class="tip"><b>另外算</b>　管線比較長、室外機要吊掛或放高處，看現場再說</div>`;
  } else {
    h += `<div class="tip"><b>包含</b>　${P.t === 'split' ? '分離式含室外機一起洗' : P.t === 'window' ? '窗型整台拆洗' : '吊隱式拆洗，要看天花板維修孔'}</div>`;
    if (P.n >= 3) h += `<div class="tip"><b>多台</b>　3 台以上每台折 300，上面已經算進去了</div>`;
    h += `<div class="tip"><b>會加價的</b>　螺絲鏽死拆不開、沒洗成，收 500</div>`;
    if (A.need === 'weak') h += `<div class="tip"><b>不冷的</b>　洗完還是不冷，可能是冷媒，要接錶量過才知道，那部分另外算</div>`;
    if (A.need === 'drip') h += `<div class="tip"><b>滴水的</b>　洗的時候接水盤跟排水管一起通</div>`;
  }
  h += `<div class="tip"><b>實際價格</b>　看現場或照片再確認，這裡是參考</div></div></div>`;
  if (away) h += `<div class="sec"><div class="card"><div class="tip">這一區要先 LINE 問一下，看時間跟距離能不能排</div></div></div>`;
  h += `<div class="sec"><h3>可以順便傳張照片</h3><div class="card"><div class="tip">開 LINE 之後，拍室內機正面一張、室外機一張，師傅看了更準。不拍也可以，先問時間</div></div></div>`;
  const sheet = quoteSheet(inst, P);
  h += `<div class="cta"><h3>帶資料到 LINE 問時段</h3><p>${CONFIG.LINE_OA ? '按下去會打開 LINE，你選的都幫你填好了，直接送出就好' : '先加小林 LINE，再把下面這份整理單貼過去'}</p>
    ${CONFIG.LINE_OA ? '' : `<div class="sheet">${sheet}</div>`}
    <a class="btn" id="toLine" href="#">${CONFIG.LINE_OA ? '用 LINE 問時段' : '加小林 LINE'}</a>
    <div style="height:10px"></div><button class="btn ghost" id="copy">複製整理單</button>
    <p class="code">你的代碼：${CODE}</p></div>
    <div class="sec"><button class="btn ghost" id="toCheck">還不確定要不要洗？先做 7 題健檢</button></div>
    <p class="note" style="margin-top:14px">服務範圍：${CONFIG.AREA}　不比廠牌</p>`;
  $('#quiz').classList.add('hide');
  const r = $('#result'); r.innerHTML = h; r.classList.remove('hide'); window.scrollTo(0, 0);
  $('#redo').onclick = () => begin('quote');
  $('#toCheck').onclick = () => begin('check');
  $('#toLine').href = lineHref(sheet);
  $('#toLine').onclick = () => { if (!CONFIG.LINE_OA) copy(sheet, false); track('quote_line', {type: A.type, n: A.n, area: A.area, need: A.need}); };
  $('#copy').onclick = () => copy(sheet, true);
  track('quote_result', {type: A.type, n: A.n, area: A.area, need: A.need});
}
function srcLine() {
  const p = new URLSearchParams(location.search), s = p.get('utm_source'), c = p.get('utm_content');
  return s ? `（從 ${s}${c ? ' ' + c : ''} 來的）` : '';
}
function quoteSheet(inst, P) {
  return [`小林你好 我想${inst ? '問裝冷氣' : '約洗冷氣'}`, `代碼 ${CODE}`,
    `機型：${label('type', A.type)}；台數：${label('n', A.n)}`,
    `地區：${label('area', A.area)}`,
    `想處理：${label('need', A.need)}`,
    inst ? '參考價：標準安裝 4,500 起' : `參考價：每台 ${fmt(P.per[0])}–${fmt(P.per[1])}${P.off ? '（淡季）' : ''}`,
    `方便的時段：`, srcLine()].filter(Boolean).join('\n');
}
function sheetText(lv) {
  const s = (A.sym || []).filter(x => x !== 'none').map(k => SYM[k].t);
  return [`小林你好 我做了冷氣檢查`, `代碼 ${CODE}`,
    `冷氣：${label('type', A.type)}，用了${label('age', A.age)}`,
    `濾網：${label('filter', A.filter)}；拆洗：${label('pro', A.pro)}`,
    `狀況：${s.length ? s.join('、') : '都沒有'}`,
    `室外機：${label('out', A.out)}；溫度：${label('temp', A.temp)}`,
    `結果：${LV[lv].tag}`, srcLine()].filter(Boolean).join('\n');
}
function lineHref(text) {
  return CONFIG.LINE_OA ? `https://line.me/R/oaMessage/${encodeURIComponent(CONFIG.LINE_OA)}/?${encodeURIComponent(text)}`
                        : `https://line.me/ti/p/~${CONFIG.LINE_PERSONAL}`;
}
function copy(t, toast) {
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).catch(() => {
    const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove();
  }).finally(() => { if (toast) { const el = $('#toast'); el.textContent = '整理單已複製'; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1600); } });
}

// ===== 共用 =====
document.querySelectorAll('.area').forEach(e => e.textContent = CONFIG.AREA);
document.querySelectorAll('.lineLink').forEach(a => { a.href = lineHref('小林你好 我家冷氣壞了'); a.target = '_blank'; a.onclick = () => track('urgent'); });
function track(ev, p) { if (window.gtag) gtag('event', 'xl_' + ev, p || {}); }
{ const m = new URLSearchParams(location.search).get('mode'); if (m === 'quote' || m === 'check') begin(m); }
if (CONFIG.GA_ID) {
  const s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + CONFIG.GA_ID; document.head.appendChild(s);
  window.dataLayer = window.dataLayer || []; window.gtag = function () { dataLayer.push(arguments); }; gtag('js', new Date()); gtag('config', CONFIG.GA_ID);
}
</script>
